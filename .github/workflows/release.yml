name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Package release artifact
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Verify release version is a semantic tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]

      - name: Validate localizations and build
        run: |
          plutil -lint Sources/MountlaneApp/Resources/en.lproj/Localizable.strings
          plutil -lint Sources/MountlaneApp/Resources/ru.lproj/Localizable.strings
          swift build --configuration release

      - name: Create distributable archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist/Mountlane
          cp .build/release/Mountlane dist/Mountlane/
          find .build/release -maxdepth 1 -type d -name '*.bundle' -exec cp -R {} dist/Mountlane/ \;
          cp README.md dist/Mountlane/
          ditto -c -k --sequesterRsrc --keepParent dist/Mountlane "dist/Mountlane-${RELEASE_TAG}-macOS.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "dist/Mountlane-${RELEASE_TAG}-macOS.zip" \
            --title "Mountlane ${RELEASE_TAG}" \
            --generate-notes
