name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test (macOS)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Validate localization files
        run: |
          plutil -lint Sources/MountlaneApp/Resources/en.lproj/Localizable.strings
          plutil -lint Sources/MountlaneApp/Resources/ru.lproj/Localizable.strings

      - name: Build release configuration
        run: swift build --configuration release

      - name: Run tests
        run: swift test
